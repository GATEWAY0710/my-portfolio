  <body>
    <div id="root"></div>

    <!--
      Static Netlify form declaration.
      Netlify parses the BUILT index.html at deploy time to register forms, and the
      real form in src/components/Contact.jsx is rendered client-side, so it would
      never be detected. This hidden copy is what registers the "contact" form in
      the Netlify dashboard. Contact.jsx posts to "/" with form-name=contact.
    -->
    <form name="contact" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
      <input type="hidden" name="form-name" value="contact" />
      <p>
        <label>Do not fill this out: <input name="bot-field" /></label>
      </p>
    </form>

    <script type="module" src="/src/main.jsx"></script>
  </body>
